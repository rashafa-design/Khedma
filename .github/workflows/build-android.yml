name: Build Android app

# Builds the Khedma Android app (a Trusted Web Activity - essentially
# Chrome wrapped as an installable app shell pointed at the live site, so
# there's no separate app codebase to maintain; only this shell needs
# rebuilding, and only when icon/branding/package-level things change,
# not for ordinary website updates). Run manually whenever a new APK is
# needed. Requires the one-time keystore (see
# generate-android-keystore.yml) to already be saved as the four secrets
# below.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (only to install the Bubblewrap CLI itself)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Restore the signing keystore from secrets
        working-directory: android
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      # Earlier attempts tried pre-staging a JDK/Android SDK ourselves
      # (via setup-java/setup-android + a hand-written Bubblewrap config)
      # and hit "the provided androidSdk isn't correct" four different
      # ways in a row, even confirmed the config file WAS being read
      # correctly - meaning our self-installed SDK just never satisfied
      # whatever Bubblewrap 1.25.0 specifically checks for. Answering "y"
      # to let Bubblewrap install its own JDK and Android SDK instead (the
      # tool's own "recommended" default) sidesteps that guessing game -
      # but padding the piped answers generously still died at the exact
      # same spot (the Android SDK question) even with 30 lines available,
      # which points at something more specific: the JDK download step
      # spawns child processes that inherit and drain our piped stdin
      # before the SDK question ever gets to read from it.
      #
      # Fix: give the JDK question its OWN step with its OWN fresh stdin,
      # deliberately letting it "fail" (exit non-zero) the moment it's
      # done downloading - all that matters is that ~/.bubblewrap/jdk ends
      # up populated, which makes the next step skip re-asking about it.
      # Same idea for the SDK question in its own step after that, so by
      # the time the real build step runs, JDK and SDK are both already
      # cached and only the keystore password prompt(s) remain to answer
      # with completely fresh, undrained stdin.
      - name: Let Bubblewrap install its own JDK (allowed to stop there)
        working-directory: android
        run: printf 'y\n' | bubblewrap build --skipPwaValidation || true

      # The JDK step above genuinely finished (4m31s, real download) and
      # its answer stays cached, so it isn't re-asked below. The Android
      # SDK question is different: separating it into its own step still
      # failed instantly, and the actual log revealed why - after the
      # first "y" answers "install the SDK?", a SECOND question ("accept
      # the SDK terms and conditions?") follows immediately, and even 15
      # padded "y" answers piped all at once still died there. That proves
      # this prompt reads and discards the ENTIRE piped buffer in one gulp
      # rather than one line per question, so no amount of padding a
      # single upfront pipe can ever satisfy more than the first prompt.
      #
      # Fix: feed answers one at a time with a real pause between each, so
      # only ever one line is sitting in the pipe when a prompt reads -
      # matching how a human answering in a real terminal would look, and
      # not giving the greedy read anything extra to consume. Each `echo`
      # blocks until bubblewrap actually reads it (pipes are only 64KB and
      # self-limiting), and the whole feeder dies via SIGPIPE the moment
      # bubblewrap exits, so this doesn't wait around once it's done.
      # Once the prompts were finally answered correctly, Gradle itself
      # refused to run: GitHub's runner image pre-sets ANDROID_SDK_ROOT to
      # its own pre-installed SDK (/usr/local/lib/android/sdk), which now
      # conflicts with Bubblewrap's own self-installed one at
      # ~/.bubblewrap/android_sdk (exported as ANDROID_HOME) - Gradle
      # refuses to guess between two different SDK paths and fails outright
      # rather than silently picking one. Unsetting the leftover one here
      # leaves ANDROID_HOME (Bubblewrap's own, correctly populated) as the
      # only source of truth, exactly as Gradle's own error suggested.
      - name: Build and sign the APK (JDK already cached above)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          unset ANDROID_SDK_ROOT
          feed() {
            echo "$1"
            sleep 3
          }
          {
            for i in $(seq 1 20); do feed "y"; done
            for i in $(seq 1 10); do feed "$ANDROID_KEYSTORE_PASSWORD"; done
          } | bubblewrap build --skipPwaValidation

      - name: Rename to a stable, predictable filename
        working-directory: android
        run: cp app-release-signed.apk Khedma.apk

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: khedma-android
          path: android/Khedma.apk

      - name: Attach APK to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-build-${{ github.run_number }}"
          gh release create "$tag" \
            "android/Khedma.apk" \
            --title "Khedma Android build #${{ github.run_number }}" \
            --notes "Automated build from commit ${{ github.sha }}."
