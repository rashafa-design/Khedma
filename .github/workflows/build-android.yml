name: Build Android app

# Builds the Khedma Android app (a Trusted Web Activity - essentially
# Chrome wrapped as an installable app shell pointed at the live site, so
# there's no separate app codebase to maintain; only this shell needs
# rebuilding, and only when icon/branding/package-level things change,
# not for ordinary website updates). Run manually whenever a new APK is
# needed. Requires the one-time keystore (see
# generate-android-keystore.yml) to already be saved as the four secrets
# below.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The action's default package list includes a legacy "tools"
      # package Google removed from the SDK repository years ago, which
      # makes the default install fail outright - platform-tools is all
      # this step actually needs to provide; Bubblewrap installs whatever
      # specific platform/build-tools versions it needs itself.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Set up Node (only to install the Bubblewrap CLI itself)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      # Bubblewrap's first-ever run interactively asks whether to install
      # its own JDK/Android SDK copies (that's what broke the first
      # attempt at this workflow - the piped keystore password answered
      # the wrong question). Pre-writing its config file with the JDK and
      # SDK we already installed above skips those questions entirely, so
      # the only prompts left are the keystore ones this step answers.
      - name: Point Bubblewrap at the JDK/SDK already installed above
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "jdk": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME",
            "androidSdk": "$ANDROID_HOME"
          }
          EOF
          echo "--- config.json ---"
          cat ~/.bubblewrap/config.json

      - name: Restore the signing keystore from secrets
        working-directory: android
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Build and sign the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          printf '%s\n%s\n%s\n' "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEYSTORE_PASSWORD" \
            | bubblewrap build --skipPwaValidation

      - name: Rename to a stable, predictable filename
        working-directory: android
        run: cp app-release-signed.apk Khedma.apk

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: khedma-android
          path: android/Khedma.apk

      - name: Attach APK to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-build-${{ github.run_number }}"
          gh release create "$tag" \
            "android/Khedma.apk" \
            --title "Khedma Android build #${{ github.run_number }}" \
            --notes "Automated build from commit ${{ github.sha }}."
