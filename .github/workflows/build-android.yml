name: Build Android app

# Builds the Khedma Android app (a Trusted Web Activity - essentially
# Chrome wrapped as an installable app shell pointed at the live site, so
# there's no separate app codebase to maintain; only this shell needs
# rebuilding, and only when icon/branding/package-level things change,
# not for ordinary website updates). Run manually whenever a new APK is
# needed. Requires the one-time keystore (see
# generate-android-keystore.yml) to already be saved as the four secrets
# below.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (only to install the Bubblewrap CLI itself)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Restore the signing keystore from secrets
        working-directory: android
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      # Earlier attempts tried pre-staging a JDK/Android SDK ourselves
      # (via setup-java/setup-android + a hand-written Bubblewrap config)
      # and hit "the provided androidSdk isn't correct" four different
      # ways in a row, even confirmed the config file WAS being read
      # correctly - meaning our self-installed SDK just never satisfied
      # whatever Bubblewrap 1.25.0 specifically checks for. Answering "y"
      # to let Bubblewrap install its own JDK and Android SDK instead (the
      # tool's own "recommended" default, the same path every TWA tutorial
      # actually exercises) sidesteps that guessing game entirely, at the
      # cost of a slower first run while it downloads them.
      # The JDK yes/no question alone ate all 3 of the previous attempt's
      # piped answers before the Android SDK question ever got one -
      # whatever's consuming stdin here (redraws, confirmation prompts,
      # etc.) uses more lines per question than a plain terminal would.
      # Padding heavily on both sides removes the guesswork: plenty of
      # "y" answers for however many yes/no questions there really are,
      # then plenty of password answers for however many follow.
      - name: Build and sign the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          {
            for i in $(seq 1 15); do echo "y"; done
            for i in $(seq 1 15); do echo "$ANDROID_KEYSTORE_PASSWORD"; done
          } | bubblewrap build --skipPwaValidation

      - name: Rename to a stable, predictable filename
        working-directory: android
        run: cp app-release-signed.apk Khedma.apk

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: khedma-android
          path: android/Khedma.apk

      - name: Attach APK to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-build-${{ github.run_number }}"
          gh release create "$tag" \
            "android/Khedma.apk" \
            --title "Khedma Android build #${{ github.run_number }}" \
            --notes "Automated build from commit ${{ github.sha }}."
