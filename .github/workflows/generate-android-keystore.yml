name: Generate Android signing keystore (run ONCE, manually)

# This creates the one signing key every future Khedma APK must be built
# with. Run it exactly once, ever. If you run it again later, it creates
# a DIFFERENT key, and any APK signed with the new key can no longer
# update an install signed with the old one - users would have to
# uninstall and reinstall. After this run, immediately download the
# keystore artifact below and save it somewhere safe outside GitHub
# (a password manager or private cloud storage) - GitHub Actions secrets
# are write-only, so if it's lost without a backup, it's lost for good.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "generate" to confirm you have not already run this before'
        required: true

jobs:
  generate:
    if: github.event.inputs.confirm == 'generate'
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK (provides keytool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -alias khedma \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore android.keystore \
            -storepass "${{ secrets.KEYSTORE_TEMP_PASSWORD }}" \
            -keypass "${{ secrets.KEYSTORE_TEMP_PASSWORD }}" \
            -dname "CN=Khedma, OU=Khedma, O=Khedma, L=Cairo, ST=Cairo, C=EG"

      - name: Show the fingerprint (needed later for assetlinks.json)
        run: |
          keytool -list -v -keystore android.keystore \
            -storepass "${{ secrets.KEYSTORE_TEMP_PASSWORD }}" \
            | grep "SHA256:"

      - name: Base64-encode for pasting into a GitHub secret later
        run: base64 -w0 android.keystore > android.keystore.base64.txt

      - name: Upload keystore (download this immediately, then delete the artifact)
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore-DOWNLOAD-THEN-DELETE
          path: |
            android.keystore
            android.keystore.base64.txt
          retention-days: 1
